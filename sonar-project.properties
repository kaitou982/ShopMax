# SonarQube 配置
sonar.projectKey=shopmax
sonar.projectName=ShopMax
sonar.projectVersion=1.0.0

# 源码目录
sonar.sources=shop-backend/shop-common,shop-backend/shop-modules,shop-backend/shop-auth,shop-backend/shop-gateway
sonar.tests=shop-backend/shop-common/shop-common-core/src/test

# 排除目录
sonar.exclusions=**/entity/**,**/dto/**,**/config/**,**/enums/**

# Java 编译目录
sonar.java.binaries=shop-backend/**/target/classes
sonar.java.libraries=shop-backend/**/target/dependency/*.jar

# 编码
sonar.sourceEncoding=UTF-8

# 覆盖率报告
sonar.coverage.jacoco.xmlReportPaths=shop-backend/**/target/site/jacoco/jacoco.xml
