global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'shopmax-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8080'  # gateway
          - 'host.docker.internal:8081'  # user-service
          - 'host.docker.internal:8082'  # product-service
          - 'host.docker.internal:8083'  # auth
          - 'host.docker.internal:8084'  # payment
          - 'host.docker.internal:8086'  # live
          - 'host.docker.internal:8087'  # community
          - 'host.docker.internal:8088'  # order
          - 'host.docker.internal:8089'  # admin
          - 'host.docker.internal:8090'  # file
          - 'host.docker.internal:8091'  # customer
          - 'host.docker.internal:8092'  # marketing
        labels:
          app: shopmax
