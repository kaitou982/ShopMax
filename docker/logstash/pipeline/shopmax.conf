input {
  tcp {
    port => 5044
    codec => json_lines
    tags => ["shopmax"]
  }
}

filter {
  if "shopmax" in tags {
    # 解析日志级别
    if [level] {
      mutate {
        add_field => { "log_level" => "%{level}" }
      }
    }

    # 解析服务名
    if [appName] {
      mutate {
        add_field => { "service_name" => "%{appName}" }
      }
    }

    # 解析 traceId
    if [traceId] {
      mutate {
        add_field => { "trace_id" => "%{traceId}" }
      }
    }

    # 添加时间戳
    mutate {
      add_field => { "received_at" => "%{@timestamp}" }
    }
  }
}

output {
  if "shopmax" in tags {
    elasticsearch {
      hosts => ["http://shopmax-elasticsearch:9200"]
      index => "shopmax-logs-%{+YYYY.MM.dd}"
    }

    # 调试输出（可注释）
    # stdout {
    #   codec => rubydebug
    # }
  }
}
