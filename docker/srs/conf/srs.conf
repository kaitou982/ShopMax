# SRS 配置文件
# ShopMax 直播带货系统

listen              1935;
http_api {
    enabled         on;
    listen          1985;
}
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# 默认虚拟主机配置
vhost __defaultVhost__ {
    # HTTP 回调配置 - 推流鉴权与状态管理
    http_hooks {
        enabled         on;
        # 推流开始回调 - 验证推流白名单，更新房间状态为"直播中"
        on_publish      http://host.docker.internal:8080/api/v1/live/srs/callback;
        # 推流结束回调 - 更新房间状态为"已结束"，触发录制上传
        on_unpublish    http://host.docker.internal:8080/api/v1/live/srs/callback;
        # 播放鉴权回调 - 验证观众播放权限
        on_play         http://host.docker.internal:8080/api/v1/live/srs/on-play;
        # 播放停止回调
        on_stop         http://host.docker.internal:8080/api/v1/live/srs/on-play;
    }

    # HLS 配置 - 用于移动端/小程序播放
    hls {
        enabled         on;
        hls_fragment    2;        # 每个切片 2 秒
        hls_window      10;       # 播放列表保留 10 个切片
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    # DVR 录制配置 - 直播录制到本地文件
    dvr {
        enabled         on;
        dvr_path        ./record/[app]/[stream].[timestamp].flv;
        dvr_plan        session;  # 每次推流会话生成一个录制文件
    }

    # HTTP-FLV 配置 - 用于 Web 端低延迟播放
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
