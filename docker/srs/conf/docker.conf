# SRS 配置文件 - 低延迟优化
# ShopMax 直播带货系统

listen              1935;
http_api {
    enabled         on;
    listen          1985;
}
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# 默认虚拟主机配置
vhost __defaultVhost__ {
    # 低延迟核心配置
    tcp_nodelay     on;     # 禁用 TCP Nagle 算法
    min_latency     on;     # 最小延迟模式
    play {
        gop_cache   off;    # 关闭 GOP 缓存（主要延迟来源）
    }
    publish {
        mr          off;    # 关闭合并读取
    }

    # HTTP 回调配置
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:8080/api/v1/live/srs/callback;
        on_unpublish    http://host.docker.internal:8080/api/v1/live/srs/callback;
    }

    # HLS 配置 - 低延迟
    hls {
        enabled         on;
        hls_fragment    1;        # 1 秒切片（从 2 改为 1）
        hls_window      5;        # 5 个切片窗口（从 10 改为 5）
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    # DVR 录制
    dvr {
        enabled         on;
        dvr_path        ./record/[app]/[stream].[timestamp].flv;
        dvr_plan        session;
    }

    # HTTP-FLV 低延迟输出
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
