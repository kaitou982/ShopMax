apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: shopmax
  labels:
    app: nacos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.4.3
          ports:
            - containerPort: 8848
            - containerPort: 9848
            - containerPort: 9849
          env:
            - name: MODE
              value: "standalone"
            - name: SPRING_DATASOURCE_PLATFORM
              value: ""
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: JVM_XMS
              value: "256m"
            - name: JVM_XMX
              value: "256m"
          volumeMounts:
            - name: nacos-data
              mountPath: /home/nacos/data
            - name: nacos-logs
              mountPath: /home/nacos/logs
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /nacos/actuator/health
              port: 8848
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: nacos-data
          persistentVolumeClaim:
            claimName: nacos-data-pvc
        - name: nacos-logs
          persistentVolumeClaim:
            claimName: nacos-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: shopmax
spec:
  selector:
    app: nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
    - name: grpc
      port: 9848
      targetPort: 9848
    - name: grpc-raft
      port: 9849
      targetPort: 9849
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nacos-data-pvc
  namespace: shopmax
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nacos-logs-pvc
  namespace: shopmax
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
