name: Deploy ShopMax

on:
  push:
    branches: [main]

jobs:
  # Vercel 前端自动部署（Vercel 自动检测 push）
  deploy-vercel:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "✅ Vercel 正在自动部署前端..."
          echo "Web: https://shop-max-kr9t.vercel.app"
          echo "移动端: https://shop-max-kiqm.vercel.app"
          echo "Admin: https://shop-max-mujl.vercel.app"

  # 后端部署到阿里云 VPS
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/shopmax
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
