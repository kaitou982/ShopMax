name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ==================== 后端构建 ====================
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Run Tests
        run: mvn test -B

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: shop-backend/**/target/*.jar
          retention-days: 7

  # ==================== SonarQube 代码质量扫描 ====================
  sonarqube:
    runs-on: ubuntu-latest
    needs: backend-build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ==================== 前端构建（Admin UI） ====================
  admin-ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: shop-admin-ui/package-lock.json

      - name: Install dependencies
        working-directory: shop-admin-ui
        run: npm ci

      - name: Lint
        working-directory: shop-admin-ui
        run: npm run lint || true

      - name: Build
        working-directory: shop-admin-ui
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-dist
          path: shop-admin-ui/dist
          retention-days: 7

  # ==================== 前端构建（Web） ====================
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: shop-frontend/package-lock.json

      - name: Install dependencies
        working-directory: shop-frontend
        run: pnpm install

      - name: Build
        working-directory: shop-frontend
        run: pnpm build:web
