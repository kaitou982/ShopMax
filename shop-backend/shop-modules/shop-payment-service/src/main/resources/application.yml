server:
  port: 8084

spring:
  application:
    name: shop-payment-service

  config:
    import: optional:nacos:${spring.application.name}.yaml

  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        enabled: true
        server-addr: localhost:8848
      config:
        enabled: true
        server-addr: localhost:8848
        file-extension: yaml

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shopmax?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: aptx4869
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:/mapper/**/*.xml

# JWT配置
jwt:
  secret: shopmax-secret-key-2026-for-jwt-signing-and-verification
  expiration: 86400000

# 支付网关配置
payment:
  notify-base-url: https://511976c3.r7.cpolar.cn
  frontend-base-url: http://localhost:3100
  alipay:
    sandbox: true
    # 从 https://open.alipay.com/develop/sandbox/app 获取以下参数
    app-id: 9021000164626534   # 沙箱APPID
    # 沙箱网关地址
    gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    # 应用私钥(PKCS8格式)
    private-key: 
    # 支付宝公钥
    alipay-public-key: 

  wechat-pay:
    mock: true
    #无营业执照，暂时搁置(需开发时设置 mock: false)
#    merchant-id: ""              # 微信支付商户号
#    api-v3-key: ""               # APIv3密钥（32位，商户平台 -> API安全 -> APIv3密钥）
#    merchant-serial-number: ""   # 商户证书序列号
#    private-key: ""              # 商户API私钥（apiclient_key.pem 文件内容）
#    app-id: "wxb41728c4b369c8b3"                   # 小程序/公众号 AppID

# 日志配置
logging:
  level:
    com.shop.payment: debug
    com.shop.payment.mapper: debug
