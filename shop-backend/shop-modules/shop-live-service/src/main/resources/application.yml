server:
  port: 8086

spring:
  application:
    name: shop-live-service

  config:
    import: optional:nacos:${spring.application.name}.yaml

  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: true
        server-addr: localhost:8848
      config:
        enabled: false
        server-addr: localhost:8848
        file-extension: yaml
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shop_live?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:aptx4869}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 5
      max-wait: 30000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  # Flyway数据库版本管理
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history

  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0


# JWT配置
# 存储配置
storage:
  minio:
    enabled: true
    endpoint: http://localhost:9000
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: shopmax
    base-url: http://localhost:9000/shopmax
    max-file-size: 10485760

jwt:
  secret: ${JWT_SECRET:shopmax-jwt-secret-2026-prod-f8K2mP9vR4xL7qW3aN6b}
  expiration: 86400000
