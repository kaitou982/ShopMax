server:
  port: 8080

spring:
  application:
    name: shop-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: true
        server-addr: localhost:8848
      config:
        enabled: false
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719
    gateway:
      # 全局 HTTP 客户端超时（Reactor Netty），防止下游服务卡死时连接堆积
      httpclient:
        connect-timeout: 3000
        response-timeout: 15s
      # 全局 CORS 配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://10.*:*"
              - "http://192.168.*:*"
              - "http://172.*:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "Content-Type"
              - "Authorization"
              - "X-Requested-With"
              - "Accept"
              - "Origin"
              - "X-User-Id"
              - "X-User-Role"
            allowCredentials: true
      # 全局默认过滤器：去除下游服务重复的 CORS 响应头，避免浏览器报多值错误
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        # ==================== 认证服务 ====================
        - id: shop-auth
          uri: lb://shop-auth
          predicates:
            - Path=/api/v1/auth/**
        # ==================== 文件服务 ====================
        - id: shop-file-service
          uri: lb://shop-file-service
          predicates:
            - Path=/api/v1/files/**
        # ==================== 用户服务 ====================
        - id: shop-user-service
          uri: lb://shop-user-service
          predicates:
            - Path=/api/v1/users/**
        # ==================== 商品服务 ====================
        - id: shop-product-service
          uri: lb://shop-product-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/brands/**,/api/v1/search/**
        # ==================== 订单服务 ====================
        - id: shop-order-service
          uri: lb://shop-order-service
          predicates:
            - Path=/api/v1/orders/**,/api/v1/logistics/**
        # ==================== 营销服务 ====================
        - id: shop-marketing-service
          uri: lb://shop-marketing-service
          predicates:
            - Path=/api/v1/marketing/**
        # ==================== 直播服务 ====================
        - id: shop-live-service
          uri: lb://shop-live-service
          predicates:
            - Path=/api/v1/live/**
        # ==================== 社区服务 ====================
        - id: shop-community-service
          uri: lb://shop-community-service
          predicates:
            - Path=/api/v1/community/**
        # ==================== 管理后台服务 ====================
        - id: shop-admin-service
          uri: lb://shop-admin-service
          predicates:
            - Path=/api/v1/admin/**,/api/v1/banners/**
        # ==================== 支付服务 ====================
        - id: shop-payment-service
          uri: lb://shop-payment-service
          predicates:
            - Path=/api/v1/payments/**
        # ==================== 智能客服服务 ====================
        - id: shop-customer-service
          uri: lb://shop-customer-service
          predicates:
            - Path=/api/v1/cs/**
        - id: shop-customer-service-ws
          uri: lb://shop-customer-service
          predicates:
            - Path=/ws/cs/**
        # ==================== 直播 WebSocket ====================
        - id: shop-live-service-ws
          uri: lb://shop-live-service
          predicates:
            - Path=/ws/live/**
  codec:
    max-in-memory-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

# ==================== JWT配置 ====================
jwt:
  secret: ${JWT_SECRET:shopmax-jwt-secret-2026-prod-f8K2mP9vR4xL7qW3aN6b}
  expiration: 86400000

# Actuator 端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# 灰度发布配置
gray:
  release:
    enabled: ${GRAY_RELEASE_ENABLED:false}
    version: ${GRAY_RELEASE_VERSION:gray}
    percentage: ${GRAY_RELEASE_PERCENTAGE:0}
    user-ids: ${GRAY_RELEASE_USER_IDS:}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
