server:
  port: 8083

spring:
  application:
    name: shop-auth

  config:
    import: optional:nacos:${spring.application.name}.yaml

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shop_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:aptx4869}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 5
      max-wait: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  mail:
    host: smtp.qq.com
    username: ${MAIL_USERNAME:1773559695@qq.com}
    password: ${MAIL_PASSWORD:changeme}
    port: 465
    protocol: smtp
    properties:
      from: 1773559695@qq.com
      mail.smtp.ssl.enable: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: true
        server-addr: localhost:8848
      config:
        enabled: false
        server-addr: localhost:8848
        file-extension: yaml
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719

  # Flyway数据库版本管理
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history

feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 8000

jwt:
  secret: ${JWT_SECRET:shopmax-jwt-secret-2026-prod-f8K2mP9vR4xL7qW3aN6b}
  expiration: 86400000
