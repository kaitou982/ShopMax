<h2>移动端搜索页面布局</h2>
<p class="subtitle">选择搜索页面的整体布局风格</p>

<div class="cards">
  <div class="card" data-choice="a" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#f5f5f5;padding:16px;border-radius:8px;font-family:system-ui;font-size:13px;">
        <!-- 模拟移动端搜索页 -->
        <div style="background:linear-gradient(90deg,#FF5000,#FF9000);padding:10px 12px;border-radius:6px;margin-bottom:12px;display:flex;align-items:center;gap:8px;">
          <div style="background:#fff;border-radius:20px;flex:1;padding:6px 12px;font-size:12px;color:#999;">🔍 搜索商品</div>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:12px;">
          <span style="background:#fff;padding:4px 10px;border-radius:4px;font-size:11px;">综合</span>
          <span style="background:#fff;padding:4px 10px;border-radius:4px;font-size:11px;">价格↑</span>
          <span style="background:#fff;padding:4px 10px;border-radius:4px;font-size:11px;">销量</span>
          <span style="background:#fff;padding:4px 10px;border-radius:4px;font-size:11px;">筛选</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div style="background:#fff;border-radius:6px;overflow:hidden;">
            <div style="height:100px;background:#e0e0e0;"></div>
            <div style="padding:6px;"><div style="font-size:11px;">商品名称</div><div style="color:#FF5000;font-weight:700;font-size:13px;">¥299</div></div>
          </div>
          <div style="background:#fff;border-radius:6px;overflow:hidden;">
            <div style="height:100px;background:#d0d0d0;"></div>
            <div style="padding:6px;"><div style="font-size:11px;">商品名称</div><div style="color:#FF5000;font-weight:700;font-size:13px;">¥199</div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A: 标准布局</h3>
      <p>搜索栏 + 排序Tab + 双列商品网格，简洁高效</p>
    </div>
  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#f5f5f5;padding:16px;border-radius:8px;font-family:system-ui;font-size:13px;">
        <!-- 模拟移动端搜索建议态 -->
        <div style="background:linear-gradient(90deg,#FF5000,#FF9000);padding:10px 12px;border-radius:6px;margin-bottom:12px;display:flex;align-items:center;gap:8px;">
          <div style="background:#fff;border-radius:20px;flex:1;padding:6px 12px;font-size:12px;color:#333;">iPh|<span style="color:#999;">one</span></div>
        </div>
        <!-- 建议下拉 -->
        <div style="background:#fff;border-radius:6px;padding:8px 12px;margin-bottom:12px;">
          <div style="padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:12px;">📱 <b>iPh</b>one 15 Pro</div>
          <div style="padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:12px;">📱 <b>iPh</b>one 15</div>
          <div style="padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:12px;">📱 <b>iPh</b>one 14</div>
          <div style="padding:8px 0;font-size:12px;color:#FF5000;">🔥 热搜：<b>iPh</b>one</div>
        </div>
        <div style="background:#fff;border-radius:6px;padding:10px;">
          <div style="font-size:11px;color:#999;margin-bottom:6px;">🔥 热门搜索</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;">
            <span style="background:#FFF3EC;color:#FF5000;padding:3px 8px;border-radius:4px;font-size:10px;">iPhone</span>
            <span style="background:#f5f5f5;padding:3px 8px;border-radius:4px;font-size:10px;">华为</span>
            <span style="background:#f5f5f5;padding:3px 8px;border-radius:4px;font-size:10px;">小米</span>
            <span style="background:#f5f5f5;padding:3px 8px;border-radius:4px;font-size:10px;">笔记本</span>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B: 带建议下拉</h3>
      <p>输入时显示商品名+热搜混合建议，未输入时显示热搜和历史</p>
    </div>
  </div>
</div>

<div style="margin-top:24px;">
  <h3>搜索状态流转</h3>
  <p class="subtitle">搜索页面包含 3 个状态</p>
  <div style="display:flex;gap:12px;font-family:system-ui;font-size:12px;">
    <div style="flex:1;background:#fff;border:2px solid #FF5000;border-radius:8px;padding:12px;text-align:center;">
      <div style="font-weight:700;color:#FF5000;margin-bottom:4px;">初始态</div>
      <div style="color:#666;">热搜标签 + 搜索历史</div>
    </div>
    <div style="align-self:center;color:#999;">→</div>
    <div style="flex:1;background:#fff;border:2px solid #1890ff;border-radius:8px;padding:12px;text-align:center;">
      <div style="font-weight:700;color:#1890ff;margin-bottom:4px;">输入态</div>
      <div style="color:#666;">实时建议下拉</div>
    </div>
    <div style="align-self:center;color:#999;">→</div>
    <div style="flex:1;background:#fff;border:2px solid #52c41a;border-radius:8px;padding:12px;text-align:center;">
      <div style="font-weight:700;color:#52c41a;margin-bottom:4px;">结果态</div>
      <div style="color:#666;">商品列表 + 排序筛选</div>
    </div>
  </div>
</div>
