<h2>内容形式选择</h2>
<p class="subtitle">图文和短视频的技术实现、运营成本和用户消费场景完全不同</p>

<div class="cards">
  <div class="card" data-choice="image-text" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup" style="min-height:120px">
        <div class="mockup-body" style="padding:12px">
          <div style="display:flex;gap:8px;align-items:center">
            <div style="width:80px;height:100px;background:#f0f0f0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#ccc">🖼</div>
            <div style="flex:1">
              <div style="height:10px;width:70%;background:#e0e0e0;border-radius:4px;margin-bottom:6px"></div>
              <div style="height:8px;width:90%;background:#e8e8e8;border-radius:3px;margin-bottom:4px"></div>
              <div style="height:8px;width:60%;background:#e8e8e8;border-radius:3px;margin-bottom:4px"></div>
              <div style="height:8px;width:40%;background:#e8e8e8;border-radius:3px"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A. 纯图文笔记 MVP</h3>
      <p>多图+文字，支持商品标签。先验证种草→购买闭环，短视频后续迭代再加。</p>
      <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">
        <span class="label">开发量小</span><span class="label">上传快</span><span class="label">内容生产成本低</span>
      </div>
    </div>
  </div>

  <div class="card" data-choice="both" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup" style="min-height:120px">
        <div class="mockup-body" style="padding:12px">
          <div style="display:flex;gap:8px">
            <div style="flex:1;text-align:center">
              <div style="width:100%;height:70px;background:#f0f0f0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px">▶</div>
              <div style="font-size:10px;color:#999;margin-top:4px">短视频</div>
            </div>
            <div style="flex:1;text-align:center">
              <div style="width:100%;height:70px;background:#f0f0f0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px">🖼</div>
              <div style="font-size:10px;color:#999;margin-top:4px">图文</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B. 图文+短视频一起上</h3>
      <p>一次做全，视频需处理上传、转码、播放器、CDN 等。开发量大但体验完整。</p>
      <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">
        <span class="label">体验完整</span><span class="label">开发量大</span><span class="label">CDN成本</span>
      </div>
    </div>
  </div>

  <div class="card" data-choice="image-first" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup" style="min-height:120px">
        <div class="mockup-body" style="padding:12px">
          <div style="display:flex;gap:8px;align-items:center">
            <div style="width:80px;height:100px;background:#f0f0f0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#ccc">🖼</div>
            <div style="flex:1">
              <div style="height:6px;width:50%;background:#d0e8ff;border-radius:3px;margin-bottom:8px"></div>
              <div style="height:8px;width:90%;background:#e8e8e8;border-radius:3px;margin-bottom:4px"></div>
              <div style="height:8px;width:70%;background:#e8e8e8;border-radius:3px;margin-bottom:4px"></div>
              <div style="display:flex;gap:4px;align-items:center;margin-top:6px">
                <div style="background:#ffe0c0;border-radius:3px;padding:2px 6px;font-size:10px">¥ 商品标签</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>C. 图文为主 + 视频预留（推荐）</h3>
      <p>MVP 先做图文笔记，但数据模型和前端组件预留视频能力，后续平滑升级。</p>
      <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">
        <span class="label">快速上线</span><span class="label">架构可扩展</span><span class="label">迭代友好</span>
      </div>
    </div>
  </div>
</div>
