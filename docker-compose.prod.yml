# ============================================================
# ShopMax 生产环境 - 精简版（适配 2核4G ECS）
# 部署: docker compose -f docker-compose.prod.yml up -d --build
# ============================================================

services:
  nginx:
    image: nginx:alpine
    container_name: shopmax-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      shop-gateway:
        condition: service_healthy
    networks:
      - shopmax-net
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: shopmax-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./docs/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopmax-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:7-alpine
    container_name: shopmax-redis
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopmax-net
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: shopmax-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: ""
      JVM_XMS: 128m
      JVM_XMX: 256m
    volumes:
      - ./data/nacos/logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 8
    networks:
      - shopmax-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  minio:
    image: minio/minio:latest
    container_name: shopmax-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    command: server /data
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - shopmax-net
    restart: unless-stopped

  # ==================== 核心微服务（只保留4个）====================
  shop-gateway:
    build:
      context: ./shop-backend
      args:
        MODULE: shop-gateway
        MVN_MODULE: shop-gateway
    container_name: shopmax-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: "-Xmx192m -Xms128m"
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - shopmax-net
    restart: unless-stopped

  shop-user:
    build:
      context: ./shop-backend
      args:
        MODULE: shop-user-service
        MVN_MODULE: shop-modules/shop-user-service
    container_name: shopmax-user
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      JAVA_OPTS: "-Xmx256m -Xms128m"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - shopmax-net
    restart: unless-stopped

  shop-product:
    build:
      context: ./shop-backend
      args:
        MODULE: shop-product-service
        MVN_MODULE: shop-modules/shop-product-service
    container_name: shopmax-product
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      JAVA_OPTS: "-Xmx256m -Xms128m"
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - shopmax-net
    restart: unless-stopped

  shop-community:
    build:
      context: ./shop-backend
      args:
        MODULE: shop-community-service
        MVN_MODULE: shop-modules/shop-community-service
    container_name: shopmax-community
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      JAVA_OPTS: "-Xmx256m -Xms128m"
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - shopmax-net
    restart: unless-stopped

  shop-auth:
    build:
      context: ./shop-backend
      args:
        MODULE: shop-auth
        MVN_MODULE: shop-auth
    container_name: shopmax-auth
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: "-Xmx192m -Xms128m"
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - shopmax-net
    restart: unless-stopped

networks:
  shopmax-net:
    driver: bridge
